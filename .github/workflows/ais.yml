# Every 15 minutes: connect to AISStream for 3 minutes, then publish the snapshot to the
# `ais-data` branch. The website reads that branch directly, so the main site never redeploys.
name: AIS snapshot

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # every 15 min, away from the busy top of the hour
  workflow_dispatch:                # lets you run it by hand from the Actions tab

permissions:
  contents: write                   # needed to push the ais-data branch

concurrency:
  group: ais-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the WebSocket library
        run: pip install "websockets==15.0.1"

      - name: Bring back the files that accumulate between runs
        run: |
          mkdir -p ais-out
          if git fetch --depth=1 origin ais-data 2>/dev/null; then
            git show FETCH_HEAD:vessels_static.json > ais-out/vessels_static.json 2>/dev/null || rm -f ais-out/vessels_static.json
            git show FETCH_HEAD:counts_history.csv  > ais-out/counts_history.csv  2>/dev/null || rm -f ais-out/counts_history.csv
          fi

      - name: Collect a 3-minute AIS snapshot
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
        run: python3 tools/ais_collect.py --out ais-out --seconds 180

      - name: Publish to the ais-data branch (a single commit, replaced each run)
        run: |
          cd ais-out
          git init -q -b ais-data
          git config user.name "ais-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "AIS snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ais-data
