# Once a day: ask Global Fishing Watch for the latest complete day of vessel presence in the strait,
# then publish it to the `ais-data` branch. The website reads that branch directly, so the site never redeploys.
name: AIS snapshot

on:
  schedule:
    - cron: "17 6 * * *"            # 06:17 UTC daily; GFW data run about 4 days behind
  workflow_dispatch:                # lets you run it by hand from the Actions tab
    inputs:
      backfill:
        description: "Also fill daily counts for this many past days (e.g. 60). Leave 0 normally."
        required: false
        default: "0"

permissions:
  contents: write                   # needed to push the ais-data branch

concurrency:
  group: ais-snapshot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bring back the history file that accumulates between runs
        run: |
          mkdir -p ais-out
          if git fetch --depth=1 origin ais-data 2>/dev/null; then
            git show FETCH_HEAD:counts_history.csv > ais-out/counts_history.csv 2>/dev/null || rm -f ais-out/counts_history.csv
          fi

      - name: Collect the latest day from Global Fishing Watch
        env:
          GFW_API_TOKEN: ${{ secrets.GFW_API_TOKEN }}
        run: python3 tools/gfw_collect.py --out ais-out --backfill "${{ github.event.inputs.backfill || '0' }}"

      - name: Publish to the ais-data branch (a single commit, replaced each run)
        run: |
          cd ais-out
          git init -q -b ais-data
          git config user.name "ais-snapshot-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "GFW presence $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ais-data
