<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Open-source map of the Taiwan Strait: Kinmen, Matsu and Penghu case studies, maritime law, infrastructure and the Taiwan–PRC military balance, with every layer sourced.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d4f7a'/%3E%3Cpath d='M9 22 L23 10' stroke='%23e46bb4' stroke-width='3' stroke-dasharray='4 3'/%3E%3C/svg%3E">
<style>
  :root { color-scheme: light; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  body { margin: 0; font: 14px system-ui, sans-serif; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Kinmen Strait Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>

<style>
  /* Layout: full-bleed nautical chart; one compact header card; everything else opens on demand
     (layer drawer, reading pane, military balance). Taiwan = navy, PRC = red throughout. */
  :root {
    --sea: #ecf2f6;  --deep: #9fbcd1;  --land: #e8dfc6;  --coast: #7a7259;
    --ink: #142233;  --ink-soft: #5a6573;  --rule: #dfe4ea;  --panel: #ffffff;  --panel-2: #f6f8fa;
    --roc: #1d4f7a;  --prc: #b3261e;
    --aoi: #1d4f7a;  --limit: #a3166f;  --ts: #2e6e8e;  --cable: #6b4fa0;  --beyond: #e08a1e;  --alert: #b3361f;
    --shadow: 0 10px 30px rgba(14, 28, 45, 0.14);
    --radius: 10px;
    --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sea: #0e1923; --deep: #02070c; --land: #2a2a22; --coast: #9a927a;
      --ink: #e3e8ed; --ink-soft: #9ba6b2; --rule: #253140; --panel: #131c26; --panel-2: #18232f;
      --roc: #6aa6dc; --prc: #ef6b5f;
      --aoi: #6fa6d6; --limit: #e46bb4; --ts: #7fb6d1; --cable: #b9a2e0; --beyond: #f0a54a; --alert: #e0664f;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --sea: #0e1923; --deep: #02070c; --land: #2a2a22; --coast: #9a927a;
    --ink: #e3e8ed; --ink-soft: #9ba6b2; --rule: #253140; --panel: #131c26; --panel-2: #18232f;
    --roc: #6aa6dc; --prc: #ef6b5f;
    --aoi: #6fa6d6; --limit: #e46bb4; --ts: #7fb6d1; --cable: #b9a2e0; --beyond: #f0a54a; --alert: #e0664f;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body { background: var(--sea); color: var(--ink); font-family: var(--sans); overflow: hidden; }
  #map { position: absolute; inset: 0; }
  button { font-family: inherit; }
  :focus-visible { outline: 2px solid var(--limit); outline-offset: 2px; }

  /* ---------- Minimal MapLibre styles ---------- */
  .maplibregl-map { position: relative; overflow: hidden; -webkit-tap-highlight-color: transparent; }
  .maplibregl-canvas { position: absolute; left: 0; top: 0; }
  .maplibregl-canvas-container.maplibregl-interactive { cursor: grab; }
  .maplibregl-canvas-container.maplibregl-interactive:active { cursor: grabbing; }
  .maplibregl-ctrl-top-right, .maplibregl-ctrl-bottom-right, .maplibregl-ctrl-top-left { position: absolute; pointer-events: none; z-index: 2; }
  .maplibregl-ctrl-top-right { top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); }
  .maplibregl-ctrl-top-left { top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px); }
  .maplibregl-ctrl-bottom-right { bottom: env(safe-area-inset-bottom, 0px); right: env(safe-area-inset-right, 0px); }
  .maplibregl-ctrl { pointer-events: auto; clear: both; }
  .maplibregl-ctrl-top-right .maplibregl-ctrl { float: right; margin: 14px 14px 0 0; }
  .maplibregl-ctrl-top-left .maplibregl-ctrl { float: left; margin: 14px 0 0 14px; }
  .maplibregl-ctrl-bottom-right .maplibregl-ctrl { float: right; margin: 0 14px 36px 0; }
  .maplibregl-ctrl-group { background: var(--panel); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; }
  .maplibregl-ctrl-group button {
    display: block; width: 36px; height: 36px; padding: 0; border: 0; background: transparent;
    color: var(--ink); cursor: pointer; font: 500 17px/36px var(--mono);
  }
  .maplibregl-ctrl-group button + button { border-top: 1px solid var(--rule); }
  .maplibregl-ctrl-group button:hover { background: var(--panel-2); }
  .maplibregl-ctrl-icon { display: block; width: 100%; height: 100%; }
  .maplibregl-ctrl-zoom-in .maplibregl-ctrl-icon::before { content: "+"; }
  .maplibregl-ctrl-zoom-out .maplibregl-ctrl-icon::before { content: "−"; }
  .maplibregl-ctrl-scale {
    background: color-mix(in srgb, var(--panel) 85%, transparent); border: 1.5px solid var(--ink-soft); border-top: 0;
    padding: 1px 6px; font: 11px var(--mono); color: var(--ink); box-sizing: border-box;
  }
  .maplibregl-marker { position: absolute; top: 0; left: 0; will-change: transform; }

  /* ---------- Chart lettering ---------- */
  .lbl { pointer-events: none; white-space: nowrap; text-shadow: 0 0 3px var(--sea), 0 0 7px var(--sea); }
  .lbl-land { font: 600 10.5px var(--sans); letter-spacing: 0.18em; text-transform: uppercase; color: var(--coast);
              text-shadow: 0 0 3px var(--land), 0 0 7px var(--land); }
  .lbl-island { font: 600 12px var(--sans); letter-spacing: 0.04em; color: var(--ink); text-shadow: 0 0 3px var(--land), 0 0 7px var(--land); }
  .lbl-sea { font: italic 400 16px var(--serif); letter-spacing: 0.08em; color: var(--aoi); opacity: 0.75; }
  .lbl-line, .lbl-adiz { font: 500 10px var(--mono); letter-spacing: 0.08em; color: var(--limit); }
  .lbl-adiz { color: var(--ink-soft); }
  .lbl-depth { font: italic 400 12px var(--serif); color: var(--aoi); opacity: .75; }
  .zoom-far .lbl-near, .zoom-near .lbl-far, .lbl.off { display: none; }

  /* ---------- Infrastructure markers: Taiwan circle (navy), PRC square (red) ---------- */
  .mk {
    display: grid; place-items: center; width: 20px; height: 20px; padding: 0; box-sizing: border-box;
    font: 600 10px/1 var(--mono); color: #fff; background: var(--roc); border: 2px solid var(--panel);
    border-radius: 50%; box-shadow: 0 1px 4px rgba(0,0,0,.35); cursor: pointer;
  }
  .mk.prc { background: var(--prc); border-radius: 4px; }
  .mk.military { box-shadow: 0 0 0 2px var(--limit), 0 1px 4px rgba(0,0,0,.35); }
  .zoom-far .mk, .infra-off .mk { display: none; }

  /* ---------- Header card ---------- */
  #hud {
    position: absolute; z-index: 4; top: calc(16px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px));
    width: 360px; padding: 18px 18px 14px; display: grid; gap: 12px;
    background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .kicker { margin: 0; font: 500 10.5px/1.2 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
  h1 { margin: 2px 0 0; font: 600 26px/1.1 var(--serif); letter-spacing: -0.01em; text-wrap: balance; }
  .dek { margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; color: var(--ink-soft); }
  .tabs { display: flex; gap: 2px; padding: 3px; background: var(--panel-2); border-radius: 8px; }
  .tabs button {
    flex: 1; min-height: 34px; padding: 0 4px; border: 0; border-radius: 6px; background: transparent;
    color: var(--ink-soft); font: 500 12.5px var(--sans); cursor: pointer;
  }
  .tabs button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .tabs button[data-view="balance"][aria-pressed="true"] { color: var(--prc); }
  .actions { display: flex; gap: 8px; }
  .actions button {
    display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 12px;
    border: 1px solid var(--rule); border-radius: 8px; background: transparent; color: var(--ink);
    font: 500 13px var(--sans); cursor: pointer;
  }
  .actions button:hover, .actions button[aria-expanded="true"] { background: var(--panel-2); }
  .count { font: 500 11px var(--mono); color: var(--ink-soft); }

  /* ---------- Layer drawer ---------- */
  #drawer {
    position: absolute; z-index: 5; width: 360px; padding: 14px; display: grid; gap: 10px;
    left: calc(16px + env(safe-area-inset-left, 0px));
    background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .drawer-head { display: flex; justify-content: space-between; align-items: baseline; }
  .drawer-head small { color: var(--ink-soft); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: stretch; border: 1px solid var(--rule); border-radius: 999px; overflow: hidden; }
  .chip .tog {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 4px 6px 10px; border: 0; background: transparent;
    color: var(--ink-soft); font: 500 12.5px var(--sans); cursor: pointer;
  }
  .chip .tog[aria-pressed="true"] { color: var(--ink); }
  .chip:has(.tog[aria-pressed="true"]) { border-color: color-mix(in srgb, var(--ink) 35%, var(--rule)); background: var(--panel-2); }
  .chip .inf { padding: 0 9px 0 5px; border: 0; background: transparent; color: var(--ink-soft); font: italic 600 12px var(--serif); cursor: pointer; }
  .sw { width: 16px; height: 10px; flex: none; border-radius: 2px; opacity: .35; }
  .tog[aria-pressed="true"] .sw { opacity: 1; }
  .sw-line { height: 0; border-top: 2px dashed currentColor; border-radius: 0; }

  /* ---------- Reading pane (side sheet / phone sheet) ---------- */
  #sheet {
    position: absolute; z-index: 6; top: calc(16px + env(safe-area-inset-top, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    right: calc(16px + env(safe-area-inset-right, 0px)); width: 420px; display: flex; flex-direction: column;
    background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
  }
  #sheet.wide { width: 600px; }
  .sheet-bar { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; border-bottom: 1px solid var(--rule); }
  .sheet-bar .crumb { flex: 1; min-width: 0; font: 500 10.5px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn { width: 34px; height: 34px; border: 0; border-radius: 8px; background: transparent; color: var(--ink); font-size: 18px; cursor: pointer; }
  .icon-btn:hover { background: var(--panel-2); }
  .sheet-body { flex: 1; overflow-y: auto; padding: 18px 20px 24px; min-width: 0; }
  .sheet-body h2 { margin: 0 0 6px; font: 600 22px/1.15 var(--serif); text-wrap: balance; }
  .sheet-body .meta { margin: 0 0 14px; font: 11.5px/1.5 var(--mono); color: var(--ink-soft); }
  .prose { font-size: 14px; line-height: 1.6; max-width: 62ch; }
  .prose p { margin: 0 0 12px; }
  .prose a, .sheet-body a { color: var(--aoi); }
  .defs { margin: 0; display: grid; gap: 12px; }
  .defs dt { font: 500 10.5px var(--mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--limit); }
  .defs dd { margin: 3px 0 0; }
  .modules { list-style: none; margin: 0; padding: 0; display: grid; }
  .modules li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dotted var(--rule); font-size: 13.5px; }
  .tag { font: 500 10.5px var(--mono); color: var(--ink-soft); white-space: nowrap; }
  .tag.live { color: var(--aoi); }
  .sources { margin: 0; padding-left: 18px; display: grid; gap: 10px; font-size: 13px; line-height: 1.5; color: var(--ink-soft); }
  .sources b { color: var(--ink); font-weight: 600; }
  .sources .lim { display: block; margin-top: 2px; font-style: italic; }
  .finding strong { font-weight: 600; }

  /* Note cards in the list */
  .cards { display: grid; gap: 8px; }
  .card {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; width: 100%; text-align: left;
    padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); color: var(--ink); cursor: pointer;
  }
  .card:hover { background: var(--panel-2); }
  .card .t { font: 600 14px var(--sans); }
  .card .s { grid-column: 1; font-size: 12.5px; line-height: 1.45; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .chev { grid-row: 1 / span 2; grid-column: 2; color: var(--ink-soft); font-size: 18px; }
  .group-title { margin: 18px 0 8px; font: 500 10.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); }
  .group-title:first-child { margin-top: 0; }

  /* ---------- Military balance ---------- */
  .bal-head { display: grid; gap: 10px; margin-bottom: 8px; }
  .legend { display: flex; gap: 16px; font-size: 13px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .seg { display: inline-flex; justify-self: start; padding: 3px; background: var(--panel-2); border-radius: 8px; gap: 2px; }
  .seg button { min-height: 30px; padding: 0 12px; border: 0; border-radius: 6px; background: transparent; color: var(--ink-soft); font: 500 12.5px var(--sans); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .bal-note { font-size: 12px; line-height: 1.5; color: var(--ink-soft); margin: 0; }
  .metric { border-bottom: 1px solid var(--rule); }
  .metric > button {
    display: grid; grid-template-columns: 1fr; gap: 6px; width: 100%; padding: 12px 2px; border: 0; background: transparent;
    color: var(--ink); text-align: left; cursor: pointer;
  }
  .metric > button:hover .mlabel > span:first-child { color: var(--aoi); }
  .mlabel { display: flex; justify-content: space-between; gap: 8px; font: 500 13.5px var(--sans); }
  .mlabel .flag { font: 500 10px var(--mono); color: var(--ink-soft); text-transform: uppercase; letter-spacing: .08em; }
  .fly { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; align-items: center; }
  .side { display: flex; align-items: center; gap: 6px; height: 18px; min-width: 0; font: 500 11.5px var(--mono); font-variant-numeric: tabular-nums; }
  .side.roc { flex-direction: row-reverse; }
  .bar { height: 14px; border-radius: 3px; min-width: 2px; flex: none; }
  .side.roc .bar { background: var(--roc); }
  .side.prc .bar { background: var(--prc); background-image: repeating-linear-gradient(45deg, transparent 0 4px, rgba(255,255,255,.2) 4px 6px); }
  .bar.na { width: 40px; background: transparent !important; background-image: repeating-linear-gradient(45deg, var(--rule) 0 3px, transparent 3px 6px) !important; }
  .side.roc .v { color: var(--roc); }
  .side.prc .v { color: var(--prc); }
  .detail { padding: 2px 2px 16px; display: grid; gap: 10px; font-size: 13px; line-height: 1.55; }
  .detail p { margin: 0; }
  .big { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; }
  .big div { display: grid; gap: 2px; }
  .big .n { font: 600 26px/1 var(--serif); font-variant-numeric: tabular-nums; }
  .big .roc .n { color: var(--roc); }
  .big .prc { text-align: right; }
  .big .prc .n { color: var(--prc); }
  .big .who { font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
  .ratio { font: 500 12px var(--mono); color: var(--ink-soft); text-align: center; align-self: center; }
  .caveat { padding: 8px 10px; border-left: 3px solid var(--beyond); background: var(--panel-2); border-radius: 0 6px 6px 0; }
  .src { font-size: 12px; color: var(--ink-soft); }

  /* ---------- Readouts ---------- */
  #coords {
    position: absolute; z-index: 2; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(64px + env(safe-area-inset-bottom, 0px));
    padding: 5px 9px; border-radius: 6px; background: color-mix(in srgb, var(--panel) 90%, transparent);
    font: 400 11.5px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  #attrib {
    position: absolute; z-index: 2; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    font: 10.5px var(--sans); color: var(--ink-soft); background: color-mix(in srgb, var(--panel) 75%, transparent); padding: 2px 6px; border-radius: 4px;
  }
  #crosshair { display: none; position: absolute; z-index: 2; left: 50%; top: 50%; width: 18px; height: 18px; transform: translate(-50%, -50%); pointer-events: none; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: var(--limit); }
  #crosshair::before { left: 8px; top: 0; width: 2px; height: 18px; }
  #crosshair::after { top: 8px; left: 0; height: 2px; width: 18px; }
  #status {
    position: absolute; z-index: 9; top: calc(12px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    max-width: min(560px, calc(100% - 32px)); padding: 10px 14px; border-radius: 8px; background: var(--alert); color: #fff; font-size: 13.5px;
  }

  /* ---------- Phones ---------- */
  @media (max-width: 760px) {
    #hud {
      top: auto; left: 0; right: 0; bottom: 0; width: auto; border-radius: 14px 14px 0 0; gap: 10px;
      padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    }
    #hud .kicker, #hud .dek { display: none; }
    h1 { font-size: 20px; }
    .tabs button { font-size: 12px; min-height: 32px; }
    #drawer { left: 8px; right: 8px; width: auto; }
    #sheet, #sheet.wide { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 82%; border-radius: 14px 14px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
    .sheet-body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    #coords { right: auto; bottom: auto; left: calc(12px + env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); }
    .maplibregl-ctrl-top-left { top: calc(36px + env(safe-area-inset-top, 0px)); }
    #attrib { right: auto; bottom: auto; top: calc(78px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); max-width: calc(100% - 90px); }
    .mk { width: 17px; height: 17px; font-size: 9px; }
    .big .n { font-size: 22px; }
  }
  @media (pointer: coarse) { #crosshair { display: block; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>


<div id="map" aria-label="Map of the Taiwan Strait"></div>
<div id="crosshair" aria-hidden="true"></div>
<div id="coords">Hover the map for coordinates</div>
<div id="attrib">Land: © OpenStreetMap contributors (ODbL)</div>
<div id="status" role="alert" hidden></div>

<header id="hud">
  <div>
    <p class="kicker">Taiwan Strait Monitor · OSINT</p>
    <h1 id="title">Kinmen: commerce and coercion</h1>
    <p class="dek" id="dek"></p>
  </div>
  <nav class="tabs" aria-label="Views">
    <button data-view="kinmen" aria-pressed="true">Kinmen</button>
    <button data-view="matsu" aria-pressed="false">Matsu</button>
    <button data-view="penghu" aria-pressed="false">Penghu</button>
    <button data-view="strait" aria-pressed="false">Strait</button>
    <button data-view="balance" aria-pressed="false">Balance</button>
  </nav>
  <div class="actions">
    <button id="btn-layers" aria-expanded="false" aria-controls="drawer">Layers <span class="count" id="layer-count"></span></button>
    <button id="btn-notes" aria-expanded="false" aria-controls="sheet">Notes <span class="count" id="note-count"></span></button>
  </div>
</header>

<section id="drawer" aria-label="Map layers" hidden>
  <div class="drawer-head"><p class="kicker">Layers</p><small>Defaults change with each tab</small></div>
  <div class="chips" id="chips"></div>
</section>

<aside id="sheet" aria-label="Details" hidden>
  <div class="sheet-bar">
    <button class="icon-btn" id="sheet-back" aria-label="Back" hidden>‹</button>
    <span class="crumb" id="sheet-crumb"></span>
    <button class="icon-btn" id="sheet-close" aria-label="Close">×</button>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</aside>

<script>
  // ---------- Debug helper: show problems on the page instead of failing silently ----------
  function showError(msg) {
    const el = document.getElementById('status');
    el.textContent = '⚠ ' + msg;
    el.hidden = false;
    console.error(msg);
  }
  window.addEventListener('error', (e) => showError('Script error: ' + e.message));
  if (typeof maplibregl === 'undefined') showError('The map library failed to load. Check your connection and reload.');
  else start();

  function start() {
    // Coordinates are always [longitude, latitude].
    const VIEWS = {
      kinmen: [[117.95, 24.30], [118.60, 24.65]],
      matsu: [[119.80, 25.90], [120.56, 26.45]],
      penghu: [[119.28, 23.15], [119.75, 23.80]],
      strait: [[116.8, 20.6], [123.5, 29.3]],
      balance: [[116.8, 21.5], [122.5, 27.5]]
    };
    const HEADS = {
      kinmen: ['Kinmen: commerce and coercion', 'Civilian traffic and grey-zone pressure in the waters between Kinmen and Xiamen.'],
      matsu: ['Matsu: the northern frontline', 'Zones, cables and coast guard pressure around an archipelago 8 km off Fujian.'],
      penghu: ['Penghu: inside the baselines', 'How Taiwan’s legal lines wrap Penghu, and the links that tie it to Taiwan.'],
      strait: ['The Taiwan Strait', 'Strait-wide legal lines, airspace, depth and cables.'],
      balance: ['Military balance', 'Taiwan and the PRC compared, category by category, with every figure sourced.']
    };
    const isPhone = () => window.matchMedia('(max-width: 760px)').matches;
    const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    const $ = (id) => document.getElementById(id);
    const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

    // ---------- Layers: one definition drives the map, the drawer chips and the tab defaults ----------
    const LAYERS = [
      { id: 'zones', label: 'Kinmen zones', sw: '--limit', ids: ['prohibited-fill', 'prohibited-line', 'restricted-fill', 'restricted-line', 'vertices'],
        info: ['Prohibited waters (Kinmen)', 'Official vertices, MND notice of 7 June 2004. Tap a corner point for its coordinates.', 'Restricted waters (Kinmen)', 'Outer band; shares the north and west edge with the prohibited zone.'] },
      { id: 'eq', label: 'Equidistance', sw: '--ink', line: true, ids: ['eq-line', 'eq-beyond'],
        info: ['Equidistance lines (computed)', 'UNCLOS Art. 15 default between the mainland and Kinmen, and Matsu, computed by the author. Shaded: Kinmen zone area beyond it.'] },
      { id: 'ts', label: 'Territorial sea', sw: '--ts', ids: ['ts-fill', 'cz-fill', 'ts-line', 'cz-line', 'baseline-line', 'basepoints'],
        info: ['Taiwan territorial sea & contiguous zone', "12 and 24 nm from the official straight baselines (1999, amended 2009); also Penghu's prohibited and restricted waters. Kinmen and Matsu are not included. Tap a base point."] },
      { id: 'infra', label: 'Infrastructure', sw: '--roc', ids: [], markers: true,
        info: ['Key infrastructure', 'Ports, airports, bridges and garrison islands with published coordinates. Taiwan sites are navy circles, PRC sites red squares. Tap a marker.'] },
      { id: 'median', label: 'Median line', sw: '--limit', line: true, ids: ['median-line'], labels: 'lbl-line',
        info: ['Strait median line', "27°N 122°E to 23°N 118°E, per Taiwan's MND (2019). Not recognised by Beijing."] },
      { id: 'adiz', label: 'ADIZ', sw: '--ink-soft', line: true, ids: ['adiz-line'], labels: 'lbl-adiz',
        info: ['Taiwan ADIZ', "Five vertices from Taiwan's AIP (ENR 1.12-1, May 2020). Extends over part of the Fujian coast."] },
      { id: 'bathy', label: 'Depth', sw: '--deep', ids: ['bathy-fill', 'bathy-200'], labels: 'lbl-depth',
        info: ['Depth bands', '200, 1,000, 2,000, 3,000 and 4,000 m (Natural Earth). Almost the whole strait is shallower than 200 m.'] },
      { id: 'cables', label: 'Cables', sw: '--cable', line: true, ids: ['cables-line', 'cables-hit'],
        info: ['Submarine cables', 'OpenStreetMap, exported Nov 2026. Incomplete: mapped cables only. Tap a cable.'] },
      { id: 'aoi', label: 'Study areas', sw: '--aoi', line: true, ids: ['aoi-fill', 'aoi-line'],
        info: ['Study areas', 'Author-defined analytical boxes for Kinmen, Matsu and Penghu, not official boundaries'] }
    ];
    // Each tab switches on the layers that tell its story; the drawer can override.
    const DEFAULTS = {
      kinmen: ['zones', 'eq', 'infra'],
      matsu: ['eq', 'infra'],
      penghu: ['ts', 'infra'],
      strait: ['median', 'adiz', 'ts', 'bathy', 'cables', 'infra'],
      balance: ['median', 'adiz', 'ts', 'infra']
    };
    const on = new Set();
    let current = 'kinmen';   // the active tab; declared early because the map setup reads it

    // ---------- Static data ----------
    const empty = { type: 'FeatureCollection', features: [] };
    const rect = (w, s, e, n) => ({ type: 'Polygon', coordinates: [[[w, s], [e, s], [e, n], [w, n], [w, s]]] });
    const AOI = { type: 'FeatureCollection', features: [
      { type: 'Feature', properties: {}, geometry: rect(117.95, 24.30, 118.60, 24.65) },
      { type: 'Feature', properties: {}, geometry: rect(119.80, 25.90, 120.56, 26.42) },
      { type: 'Feature', properties: {}, geometry: rect(119.28, 23.15, 119.75, 23.80) }
    ] };
    const MEDIAN = { type: 'FeatureCollection', features: [{ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: [[118, 23], [122, 27]] } }] };

    function viewPadding() {
      if (isPhone()) return { top: 110, bottom: $('hud').offsetHeight + 16, left: 16, right: 16 };
      // In Balance the strait sits in the strip left of the wide panel; the header card may overlap Fujian.
      if (current === 'balance') return { top: 40, bottom: 40, left: 40, right: 640 };
      const sheetW = $('sheet').hidden ? 0 : $('sheet').offsetWidth + 16;
      return { top: 40, bottom: 40, left: 400, right: 40 + sheetW };
    }

    // ---------- The map: our own chart style, no outside tile server ----------
    const map = new maplibregl.Map({
      container: 'map',
      style: { version: 8, sources: {}, layers: [{ id: 'sea', type: 'background', paint: { 'background-color': css('--sea') } }] },
      bounds: VIEWS.kinmen, fitBoundsOptions: { padding: viewPadding() },
      maxBounds: [[112.5, 18.5], [127.5, 30.5]], minZoom: 5, maxZoom: 14,
      attributionControl: false, dragRotate: false, pitchWithRotate: false, touchPitch: false
    });
    map.touchZoomRotate.disableRotation();
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
    map.addControl(new maplibregl.ScaleControl({ unit: 'nautical', maxWidth: 110 }), isPhone() ? 'top-left' : 'bottom-right');
    map.on('error', (e) => showError('Map error: ' + (e.error && e.error.message ? e.error.message : 'unknown')));

    const load = (file) => fetch(file).then((r) => { if (!r.ok) throw new Error(file + ' returned ' + r.status); return r.json(); });

    map.on('load', () => {
      const src = (id, data) => map.addSource(id, { type: 'geojson', data: data || empty });
      ['bathy', 'baselines', 'land-strait', 'land-kinmen', 'land-matsu', 'land-penghu', 'coast-strait', 'coast-kinmen', 'coast-matsu',
       'coast-penghu', 'zones', 'eq', 'adiz', 'cables'].forEach((id) => src(id));
      src('aoi', AOI); src('median', MEDIAN);
      const L = (spec) => map.addLayer(spec);
      const isKind = (k) => ['==', ['get', 'kind'], k];
      const isZone = (z) => ['==', ['get', 'zone'], z];
      const lines = ['in', ['geometry-type'], ['literal', ['LineString', 'MultiLineString']]];
      const polys = ['in', ['geometry-type'], ['literal', ['Polygon', 'MultiPolygon']]];

      // Order: water features, land, legal lines, analysis, points on top.
      L({ id: 'bathy-fill', type: 'fill', source: 'bathy', paint: { 'fill-opacity': 0.24 } });
      L({ id: 'bathy-200', type: 'line', source: 'bathy', filter: ['==', ['get', 'depth'], 200], paint: { 'line-width': 0.8, 'line-opacity': 0.5, 'line-dasharray': [2, 2] } });
      L({ id: 'cz-fill', type: 'fill', source: 'baselines', filter: isKind('contiguous'), paint: { 'fill-opacity': 0.05 } });
      L({ id: 'ts-fill', type: 'fill', source: 'baselines', filter: isKind('territorial'), paint: { 'fill-opacity': 0.11 } });
      for (const k of ['strait', 'kinmen', 'matsu', 'penghu']) L({ id: 'land-' + k, type: 'fill', source: 'land-' + k, paint: {} });
      const coastW = ['interpolate', ['linear'], ['zoom'], 6, 0.35, 12, 0.9];
      for (const k of ['strait', 'kinmen', 'matsu', 'penghu']) L({ id: 'coast-' + k, type: 'line', source: 'coast-' + k, paint: { 'line-width': coastW } });
      L({ id: 'restricted-fill', type: 'fill', source: 'zones', filter: isZone('restricted'), paint: { 'fill-opacity': 0.06 } });
      L({ id: 'restricted-line', type: 'line', source: 'zones', filter: isZone('restricted'), paint: { 'line-width': 1.2, 'line-dasharray': [4, 2] } });
      L({ id: 'prohibited-fill', type: 'fill', source: 'zones', filter: isZone('prohibited'), paint: { 'fill-opacity': 0.11 } });
      L({ id: 'prohibited-line', type: 'line', source: 'zones', filter: isZone('prohibited'), paint: { 'line-width': 1.5 } });
      L({ id: 'eq-beyond', type: 'fill', source: 'eq', filter: polys, paint: { 'fill-opacity': 0.4 } });
      L({ id: 'eq-line', type: 'line', source: 'eq', filter: lines, paint: { 'line-width': 1.2, 'line-dasharray': [1.5, 2] } });
      L({ id: 'cz-line', type: 'line', source: 'baselines', filter: isKind('contiguous'), paint: { 'line-width': 0.8, 'line-dasharray': [4, 3] } });
      L({ id: 'ts-line', type: 'line', source: 'baselines', filter: isKind('territorial'), paint: { 'line-width': 1.1 } });
      L({ id: 'baseline-line', type: 'line', source: 'baselines', filter: isKind('baseline'), paint: { 'line-width': 1, 'line-dasharray': [1, 1.5] } });
      L({ id: 'cables-line', type: 'line', source: 'cables', paint: { 'line-width': ['interpolate', ['linear'], ['zoom'], 6, 1, 12, 2] } });
      L({ id: 'cables-hit', type: 'line', source: 'cables', paint: { 'line-width': 14, 'line-opacity': 0 } });
      L({ id: 'adiz-line', type: 'line', source: 'adiz', paint: { 'line-width': 1.3, 'line-dasharray': [6, 2, 1, 2] } });
      L({ id: 'aoi-fill', type: 'fill', source: 'aoi', paint: { 'fill-opacity': 0.03 } });
      L({ id: 'aoi-line', type: 'line', source: 'aoi', paint: { 'line-width': 1.2, 'line-dasharray': [3, 2], 'line-opacity': 0.7 } });
      L({ id: 'median-line', type: 'line', source: 'median', paint: { 'line-width': 1.5, 'line-dasharray': [5, 3] } });
      L({ id: 'vertices', type: 'circle', source: 'zones', filter: isZone('vertex'), minzoom: 9,
          paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 9, 2.5, 13, 5], 'circle-stroke-width': 1.2 } });
      L({ id: 'basepoints', type: 'circle', source: 'baselines', filter: isKind('basepoint'), minzoom: 6,
          paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, 2.5, 11, 5], 'circle-stroke-width': 1.2 } });
      applyColours();
      applyLayers();

      // Each data file is built by a script in tools/, so the analysis can be re-run.
      const set = (id, data) => map.getSource(id).setData(data);
      load('data/land.json').then((d) => {
        for (const k of ['strait', 'kinmen', 'matsu', 'penghu']) { set('land-' + k, d[k]); set('coast-' + k, d['coast_' + k]); }
      }).catch((e) => showError('Could not load the land outlines (' + e.message + ').'));
      [['zones', 'zones'], ['eq', 'equidistance'], ['bathy', 'bathymetry'], ['adiz', 'adiz'], ['baselines', 'baselines'], ['cables', 'cables']]
        .forEach(([id, f]) => load(`data/${f}.json`).then((d) => set(id, d)).catch((e) => showError(e.message)));
      load('data/infrastructure.json').then(addInfrastructure).catch((e) => showError(e.message));
      addLabels();
      updateZoomClass();
    });

    // ---------- Colours come from CSS tokens, so both themes work ----------
    const PAINT = [
      ['sea', 'background-color', '--sea'], ['bathy-fill', 'fill-color', '--deep'], ['bathy-200', 'line-color', '--aoi'],
      ['land-strait', 'fill-color', '--land'], ['land-kinmen', 'fill-color', '--land'], ['land-matsu', 'fill-color', '--land'], ['land-penghu', 'fill-color', '--land'],
      ['coast-strait', 'line-color', '--coast'], ['coast-kinmen', 'line-color', '--coast'], ['coast-matsu', 'line-color', '--coast'], ['coast-penghu', 'line-color', '--coast'],
      ['restricted-fill', 'fill-color', '--limit'], ['restricted-line', 'line-color', '--limit'], ['prohibited-fill', 'fill-color', '--limit'], ['prohibited-line', 'line-color', '--limit'],
      ['eq-beyond', 'fill-color', '--beyond'], ['eq-line', 'line-color', '--ink'],
      ['ts-fill', 'fill-color', '--ts'], ['cz-fill', 'fill-color', '--ts'], ['ts-line', 'line-color', '--ts'], ['cz-line', 'line-color', '--ts'], ['baseline-line', 'line-color', '--ts'],
      ['cables-line', 'line-color', '--cable'], ['adiz-line', 'line-color', '--ink-soft'],
      ['aoi-fill', 'fill-color', '--aoi'], ['aoi-line', 'line-color', '--aoi'], ['median-line', 'line-color', '--limit'],
      ['vertices', 'circle-color', '--panel'], ['vertices', 'circle-stroke-color', '--limit'],
      ['basepoints', 'circle-color', '--panel'], ['basepoints', 'circle-stroke-color', '--ts']
    ];
    function applyColours() {
      for (const [layer, prop, token] of PAINT) if (map.getLayer(layer)) map.setPaintProperty(layer, prop, css(token));
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyColours);
    new MutationObserver(applyColours).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

    // ---------- Layer drawer ----------
    function applyLayers() {
      for (const L of LAYERS) {
        const vis = on.has(L.id) ? 'visible' : 'none';
        for (const id of L.ids) if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', vis);
        if (L.markers) $('map').classList.toggle('infra-off', !on.has(L.id));
        if (L.labels) document.querySelectorAll('.' + L.labels).forEach((n) => n.classList.toggle('off', !on.has(L.id)));
      }
      document.querySelectorAll('.chip .tog').forEach((b) => b.setAttribute('aria-pressed', String(on.has(b.dataset.layer))));
      $('layer-count').textContent = on.size + '/' + LAYERS.length;
    }
    const chips = $('chips');
    for (const L of LAYERS) {
      const chip = el('span', 'chip');
      const tog = el('button', 'tog');
      tog.dataset.layer = L.id;
      tog.setAttribute('aria-pressed', 'false');
      const sw = el('span', 'sw' + (L.line ? ' sw-line' : ''));
      if (L.line) sw.style.color = `var(${L.sw})`; else sw.style.background = `var(${L.sw})`;
      tog.append(sw, document.createTextNode(L.label));
      tog.onclick = () => { on.has(L.id) ? on.delete(L.id) : on.add(L.id); applyLayers(); };
      const inf = el('button', 'inf', 'i');
      inf.setAttribute('aria-label', 'About ' + L.label);
      inf.onclick = () => {
        const body = el('div', 'prose');
        for (let i = 0; i < L.info.length; i += 2) { body.append(el('h2', null, L.info[i]), el('p', null, L.info[i + 1])); }
        openSheet('Layer', body, null);
      };
      chip.append(tog, inf);
      chips.append(chip);
    }
    function placeDrawer() {
      const hud = $('hud').getBoundingClientRect(), d = $('drawer');
      if (isPhone()) { d.style.top = ''; d.style.bottom = (window.innerHeight - hud.top + 8) + 'px'; }
      else { d.style.bottom = ''; d.style.top = (hud.bottom + 8) + 'px'; }
    }
    $('btn-layers').onclick = (e) => {
      e.stopPropagation();
      const d = $('drawer'), open = d.hidden;
      d.hidden = !open; $('btn-layers').setAttribute('aria-expanded', String(open));
      if (open) placeDrawer();
    };
    document.addEventListener('click', (e) => {
      if (!$('drawer').hidden && !$('drawer').contains(e.target) && !$('btn-layers').contains(e.target)) {
        $('drawer').hidden = true; $('btn-layers').setAttribute('aria-expanded', 'false');
      }
    });

    // ---------- Reading pane ----------
    const sheet = $('sheet'), sheetBody = $('sheet-body');
    let backTo = null;
    function openSheet(crumb, content, back, wide = false) {
      $('sheet-crumb').textContent = crumb;
      sheetBody.textContent = '';
      sheetBody.append(content);
      sheetBody.scrollTop = 0;
      backTo = back;
      $('sheet-back').hidden = !back;
      sheet.classList.toggle('wide', wide);
      sheet.hidden = false;
      $('btn-notes').setAttribute('aria-expanded', String(crumb === 'Notes'));
    }
    function closeSheet() { sheet.hidden = true; $('btn-notes').setAttribute('aria-expanded', 'false'); }
    $('sheet-close').onclick = closeSheet;
    $('sheet-back').onclick = () => { if (backTo) backTo(); };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeSheet(); $('drawer').hidden = true; } });

    // ---------- Notes: every research text, unshortened, behind a card ----------
    let NOTES = [], SOURCES = null;
    const plain = (html) => { const t = el('div'); t.innerHTML = html; return t.textContent.replace(/\s+/g, ' ').trim(); };
    const notesFor = (v) => NOTES.filter((n) => n.case === (v === 'balance' ? 'strait' : v));
    function updateNoteCount() { $('note-count').textContent = NOTES.length ? notesFor(current).length + 3 : ''; }
    load('data/notes.json').then((d) => { NOTES = d; updateNoteCount(); }).catch((e) => showError(e.message));
    load('data/sources.json').then((d) => { SOURCES = d; }).catch((e) => showError(e.message));

    function noteDetail(n) {
      const wrap = el('div', 'prose');
      wrap.append(el('h2', null, n.title));
      const body = el('div'); body.innerHTML = n.html;   // our own text, written in this project
      wrap.append(body);
      openSheet('Notes', wrap, showNotes);
    }
    function sourcesDetail() {
      const wrap = el('div', 'prose');
      wrap.append(el('h2', null, 'Sources & caveats'));
      const list = el('ol', 'sources');
      for (const s of (SOURCES ? SOURCES.layers : [])) {
        const li = el('li'); li.append(el('b', null, s.name + ': '), s.source + '. ');
        for (const [key, label] of [['url', 'Source'], ['reference_map', 'Official map'], ['legal_text', 'Legal text']]) {
          if (s[key]) { const a = el('a', null, label); a.href = s[key]; a.target = '_blank'; a.rel = 'noopener'; li.append(a, ' '); }
        }
        li.append(el('span', 'lim', s.limitations));
        list.append(li);
      }
      wrap.append(list);
      openSheet('Notes', wrap, showNotes);
    }
    function card(title, sub, fn) {
      const b = el('button', 'card');
      b.append(el('span', 't', title), el('span', 'chev', '›'), el('span', 's', sub));
      b.onclick = fn;
      return b;
    }
    function showNotes() {
      const wrap = el('div');
      wrap.append(el('p', 'group-title', HEADS[current === 'balance' ? 'strait' : current][0]));
      const c1 = el('div', 'cards');
      for (const n of notesFor(current)) c1.append(card(n.title, plain(n.html), () => noteDetail(n)));
      wrap.append(c1, el('p', 'group-title', 'Project'));
      const c2 = el('div', 'cards');
      for (const n of NOTES.filter((x) => x.case === 'all')) c2.append(card(n.title, plain(n.html), () => noteDetail(n)));
      c2.append(card('Sources & caveats', `${SOURCES ? SOURCES.layers.length + ' layers' : 'Every layer'} documented: source, licence, processing and limitations.`, sourcesDetail));
      c2.append(card('Military balance data', 'Where each Taiwan and PRC figure comes from, with definitions and caveats.', () => showView('balance')));
      wrap.append(c2);
      openSheet('Notes', wrap, null);
    }
    $('btn-notes').onclick = () => {
      if (!sheet.hidden && $('sheet-crumb').textContent === 'Notes' && !backTo) closeSheet(); else showNotes();
    };

    // ---------- Formatting ----------
    function toDMS(v, pos, neg) {
      const a = Math.abs(v), d = Math.floor(a), mf = (a - d) * 60, m = Math.floor(mf);
      let sec = Math.round((mf - m) * 60), mm = m, dd = d;
      if (sec === 60) { sec = 0; mm += 1; }
      if (mm === 60) { mm = 0; dd += 1; }
      return `${dd}°${String(mm).padStart(2, '0')}′${String(sec).padStart(2, '0')}″${v >= 0 ? pos : neg}`;
    }
    function toDM(v, pos, neg) { const a = Math.abs(v), d = Math.floor(a), m = ((a - d) * 60).toFixed(2).padStart(5, '0'); return `${d}°${m}′${v >= 0 ? pos : neg}`; }
    function linkP(text, url, label) {
      const p = el('p', null, text + ' ');
      if (url) { const a = el('a', null, label || 'Source'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; p.append(a); }
      return p;
    }
    function featureSheet(kicker, title, meta, paras) {
      const wrap = el('div', 'prose');
      wrap.append(el('h2', null, title), el('p', 'meta', meta));
      paras.forEach((p) => wrap.append(p));
      openSheet(kicker, wrap, null);
    }

    // ---------- Map features open the reading pane ----------
    map.on('click', 'vertices', (e) => {
      const f = e.features[0], [lng, lat] = f.geometry.coordinates;
      featureSheet('Kinmen zone corner', `Corner ${f.properties.label}`, `${toDMS(lat, 'N', 'S')}  ${toDMS(lng, 'E', 'W')}`,
        [linkP(f.properties.estimated ? 'Label partly cut off on the official map; seconds estimated (about ±150 m).' : 'Coordinate as printed on the official Mainland Affairs Council map.',
          'https://ws.mac.gov.tw/001/Upload/OldFile/public/Attachment/0411459536.pdf', 'Official map')]);
    });
    map.on('click', 'basepoints', (e) => {
      const p = e.features[0].properties;
      featureSheet('Taiwan base point', `Base point ${p.id}`, `${p.lat_dms}  ${p.lon_dms} (WGS-84)`,
        [linkP(`${p.name}. From the official baseline table (Executive Yuan, 1999, amended 2009).`, 'https://www.penghu-land.gov.tw/warehouse/%7B55246BE4-52DA-4E37-8D57-5A81290E0C58%7D/20091118.pdf', 'Notice (PDF)')]);
    });
    map.on('click', 'cables-hit', (e) => {
      const p = e.features[0].properties;
      const bits = [p.operator && p.operator !== 'null' ? `Operator: ${p.operator}.` : '', p.alt && p.alt !== 'null' ? `Also mapped as ${p.alt}.` : '',
        p.source && p.source !== 'null' ? `Mapped from: ${p.source}.` : 'No source recorded in OpenStreetMap.'].filter(Boolean).join(' ');
      featureSheet('Submarine cable', p.name, `OpenStreetMap ${p.osm}`, [linkP(bits, 'https://www.openstreetmap.org/' + p.osm, 'View in OpenStreetMap')]);
    });
    for (const id of ['vertices', 'basepoints', 'cables-hit']) {
      map.on('mouseenter', id, () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', id, () => { map.getCanvas().style.cursor = ''; });
    }

    // ---------- Infrastructure markers ----------
    const KIND = { airport: 'A', port: 'P', bridge: 'B', military: 'M' };
    function addInfrastructure(data) {
      for (const f of data.features) {
        const p = f.properties, [lng, lat] = f.geometry.coordinates;
        const b = el('button', 'mk' + (p.side === 'PRC' ? ' prc' : '') + (p.kind === 'military' ? ' military' : ''), KIND[p.kind] || '•');
        b.setAttribute('aria-label', p.name); b.title = p.name;
        b.onclick = (ev) => {
          ev.stopPropagation();
          const side = p.side === 'PRC' ? 'PRC-administered' : 'Taiwan (ROC)-administered';
          featureSheet(side, p.name, `${p.kind}${p.dual_use ? ' · dual-use' : ''} · ${toDMS(lat, 'N', 'S')} ${toDMS(lng, 'E', 'W')}`,
            [el('p', null, p.note), linkP('Photos and the full article are on Wikipedia; outside images cannot be embedded in this page.', p.source, 'Open Wikipedia')]);
        };
        new maplibregl.Marker({ element: b, anchor: 'center' }).setLngLat(f.geometry.coordinates).addTo(map);
      }
      applyLayers();
    }

    // ---------- Place labels ----------
    const LABELS = [
      ['Fujian (PRC)', [118.1, 25.9], 'land', 'far'], ['Taiwan', [120.95, 23.7], 'land', 'far'], ['Taiwan Strait', [119.9, 24.1], 'sea', 'far'],
      ['Penghu', [119.58, 23.42], 'island', 'far'], ['Matsu', [119.95, 26.28], 'island', 'far'], ['Kinmen', [118.36, 24.6], 'island', 'far'],
      ['Median line', [120.6, 25.75], 'line', 'far'], ['Taiwan ADIZ', [121.9, 28.75], 'adiz', 'far'], ['Shelf edge (200 m)', [122.75, 23.0], 'depth', 'far'],
      ['Kinmen', [118.415, 24.468], 'island', 'near'], ['Lieyu', [118.235, 24.43], 'island', 'near'], ['Xiamen', [118.105, 24.49], 'island', 'near'],
      ['Fujian (PRC)', [118.3, 24.7], 'land', 'near'], ['Xiamen–Kinmen waters', [118.2, 24.34], 'sea', 'near'],
      ['Nangan', [119.905, 26.165], 'island', 'near'], ['Beigan', [119.975, 26.245], 'island', 'near'], ['Juguang', [119.955, 25.995], 'island', 'near'],
      ['Dongyin', [120.49, 26.405], 'island', 'near'], ['Penghu', [119.6, 23.6], 'island', 'near'], ['Qimei', [119.43, 23.23], 'island', 'near'],
      ['Penghu Channel', [119.95, 23.35], 'sea', 'near']
    ];
    function addLabels() {
      for (const [t, c, k, z] of LABELS) {
        const n = el('div', `lbl lbl-${k} lbl-${z}`, t);
        if (k === 'line') n.style.transform = 'rotate(-45deg)';
        new maplibregl.Marker({ element: n, anchor: 'center' }).setLngLat(c).addTo(map);
      }
      applyLayers();
    }
    function updateZoomClass() {
      const near = map.getZoom() >= 7.8;
      $('map').classList.toggle('zoom-near', near);
      $('map').classList.toggle('zoom-far', !near);
    }
    map.on('zoom', updateZoomClass);

    // ---------- Military balance ----------
    let MIL = null, scope = 'national', openMetric = null;
    const fmt = (v, unit) => v == null ? 'n/r' : (unit === 'US$ bn' ? '$' + v.toLocaleString('en-GB', { maximumFractionDigits: 1 }) + 'bn' : v.toLocaleString('en-GB'));
    function ratioText(prc, roc) {
      if (prc == null || roc == null) return 'not publicly reported';
      if (roc === 0 && prc === 0) return 'none on either side';
      if (roc === 0) return 'Taiwan: none';
      if (prc >= roc) return `PRC : Taiwan = ${(prc / roc).toFixed(prc / roc >= 10 ? 0 : 1)} : 1`;
      return `Taiwan : PRC = ${(roc / prc).toFixed(1)} : 1`;
    }
    function showBalance() {
      if (!MIL) { load('data/military.json').then((d) => { MIL = d; showBalance(); }).catch((e) => showError(e.message)); return; }
      const wrap = el('div');
      const head = el('div', 'bal-head');
      head.append(el('h2', null, 'Military balance'));
      const legend = el('div', 'legend');
      const lg = (name, v) => { const s = el('span'); const i = el('i'); i.style.background = `var(${v})`; s.append(i, name); return s; };
      legend.append(lg('Taiwan (ROC)', '--roc'), lg('PRC', '--prc'));
      const seg = el('div', 'seg');
      seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', 'Scope');
      for (const [k, t] of [['national', 'National totals'], ['strait', 'Facing Taiwan']]) {
        const b = el('button', null, t); b.setAttribute('aria-pressed', String(scope === k));
        b.onclick = () => { scope = k; showBalance(); };
        seg.append(b);
      }
      head.append(legend, seg, el('p', 'bal-note', scope === 'strait'
        ? '“Facing Taiwan” uses the PLA Eastern and Southern Theaters, the US Defense Department’s “Taiwan Strait area”. Where no theater figure exists, the national figure is shown and flagged. Tap a row for definitions and sources.'
        : 'Whole armed forces. Each bar is scaled within its own row, so compare the two sides of a row, not bars across rows. Tap a row for definitions and sources.'));
      wrap.append(head);

      for (const g of MIL.groups) {
        wrap.append(el('p', 'group-title', g));
        for (const m of MIL.metrics.filter((x) => x.group === g)) {
          const useStrait = scope === 'strait' && m.strait;
          const v = useStrait ? m.strait : m.national;
          const max = Math.max(v.prc || 0, v.roc || 0) || 1;
          const box = el('div', 'metric');
          const btn = el('button');
          btn.setAttribute('aria-expanded', String(openMetric === m.id));
          const lab = el('span', 'mlabel'); lab.append(el('span', null, m.label));
          if (scope === 'strait' && !m.strait) lab.append(el('span', 'flag', 'national figure'));
          const fly = el('span', 'fly');
          for (const side of ['roc', 'prc']) {
            const s = el('span', 'side ' + side);
            const bar = el('span', 'bar' + (v[side] == null ? ' na' : ''));
            if (v[side] != null) bar.style.width = `calc((100% - 64px) * ${(v[side] / max).toFixed(4)})`;
            s.append(bar, el('span', 'v', fmt(v[side], m.unit)));
            fly.append(s);
          }
          btn.append(lab, fly);
          btn.onclick = () => { openMetric = openMetric === m.id ? null : m.id; showBalance(); };
          box.append(btn);
          if (openMetric === m.id) {
            const d = el('div', 'detail');
            const big = el('div', 'big');
            const cell = (cls, who, val) => { const c = el('div', cls); c.append(el('span', 'who', who), el('span', 'n', fmt(val, m.unit))); return c; };
            big.append(cell('roc', 'Taiwan', v.roc), el('span', 'ratio', ratioText(v.prc, v.roc)), cell('prc', useStrait ? 'PRC, facing Taiwan' : 'PRC', v.prc));
            d.append(big, el('p', null, m.definition));
            if (m.caveat) d.append(el('p', 'caveat', m.caveat));
            const src = el('p', 'src', 'Source: ');
            m.source.forEach((k, i) => {
              const s = MIL.sources[k]; const a = el('a', null, s.label); a.href = s.url; a.target = '_blank'; a.rel = 'noopener';
              if (i) src.append('; ');
              src.append(a);
            });
            d.append(src);
            box.append(d);
          }
          wrap.append(box);
        }
      }
      wrap.append(el('p', 'group-title', 'About these figures'), el('p', 'bal-note', MIL.note));
      const keep = sheet.hidden ? 0 : sheetBody.scrollTop;
      openSheet('Military balance', wrap, null, true);
      sheetBody.scrollTop = keep;
    }

    // ---------- Tabs ----------
    const tabs = [...document.querySelectorAll('.tabs button')];
    function showView(name, animate = true) {
      current = name;
      for (const b of tabs) b.setAttribute('aria-pressed', String(b.dataset.view === name));
      $('title').textContent = HEADS[name][0];
      $('dek').textContent = HEADS[name][1];
      on.clear(); DEFAULTS[name].forEach((l) => on.add(l)); applyLayers();
      if (name === 'balance') { openMetric = null; showBalance(); }
      else if (!sheet.hidden) closeSheet();
      updateNoteCount();
      requestAnimationFrame(() => map.fitBounds(VIEWS[name], { padding: viewPadding(), duration: animate ? 1300 : 0 }));
      try { localStorage.setItem('tsm-view', name); } catch (e) { /* storage unavailable */ }
      if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
    }
    for (const b of tabs) b.onclick = () => showView(b.dataset.view);
    let startView = location.hash.slice(1);
    if (!VIEWS[startView]) { try { startView = localStorage.getItem('tsm-view'); } catch (e) { startView = null; } }
    showView(VIEWS[startView] ? startView : 'kinmen', false);
    window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== current) showView(v); });

    // ---------- Coordinates ----------
    const coords = $('coords');
    const show = (ll, prefix) => { coords.textContent = `${prefix}${toDM(ll.lat, 'N', 'S')}  ${toDM(ll.lng, 'E', 'W')}`; };
    if (window.matchMedia('(pointer: coarse)').matches) { map.on('move', () => show(map.getCenter(), '⌖ ')); map.on('load', () => show(map.getCenter(), '⌖ ')); }
    else map.on('mousemove', (e) => show(e.lngLat, ''));
  }
</script>

</body>
</html>
